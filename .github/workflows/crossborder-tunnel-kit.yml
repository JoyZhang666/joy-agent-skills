name: Crossborder Tunnel Kit

on:
  pull_request:
    paths:
      - 'crossborder-tunnel-kit/**'
      - '.github/workflows/crossborder-tunnel-kit.yml'
  push:
    branches: [main]
    paths:
      - 'crossborder-tunnel-kit/**'
      - '.github/workflows/crossborder-tunnel-kit.yml'

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic regression tests
        working-directory: crossborder-tunnel-kit
        run: python -B -m unittest discover -s tests -v
  pinned-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch fixed official test cores
        working-directory: crossborder-tunnel-kit
        run: python3 -B tests/fetch_native.py --output "$RUNNER_TEMP/hy2-native"
      - name: Real TLS with loopback-only network namespace
        working-directory: crossborder-tunnel-kit
        run: sudo unshare --net --fork bash -c 'ip link set lo up; exec python3 -B tests/integration_hy2.py --artifacts "$1"' bash "$RUNNER_TEMP/hy2-native"
